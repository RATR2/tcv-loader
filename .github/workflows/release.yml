name: Release

# Triggered by a "tags:" trailer in the HEAD commit of a push to main, with
# "release" listed among the tags, e.g.:
#
#   Fix pack sync timeout
#
#   tags:
#   release
#
# Only the newest commit of the push is checked (same convention as things
# like "[skip ci]"), not every commit in it.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  check-trigger:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - name: 'Look for a "tags: release" trailer in the commit message'
        id: check
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          python3 - <<'EOF'
          import os

          message = os.environ.get("MESSAGE", "")
          in_tags = False
          found = False
          for line in message.splitlines():
              stripped = line.strip()
              if stripped.lower() == "tags:":
                  in_tags = True
                  continue
              if in_tags:
                  if not stripped:
                      break
                  if stripped.lower() == "release":
                      found = True
                      break

          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"should_release={'true' if found else 'false'}\n")
          EOF

  prepare:
    needs: check-trigger
    if: needs.check-trigger.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    outputs:
      game_version: ${{ steps.version.outputs.game_version }}
      release_number: ${{ steps.number.outputs.release_number }}
      base_name: ${{ steps.name.outputs.base_name }}
    steps:
      # Full history, not the default shallow clone: the changelog step below needs it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The highest entry in engine.SUPPORTED_VERSIONS, not hardcoded here,
      # so this stays correct as new game versions get support added.
      - name: Read the highest supported game version from engine.py
        id: version
        run: |
          VERSION=$(python3 -c "
          import re
          text = open('loader/loader_core/engine.py').read()
          match = re.search(r'SUPPORTED_VERSIONS\s*=\s*\[(.*?)\]', text)
          versions = re.findall(r'([\d.]+)', match.group(1))
          versions.sort(key=lambda v: [int(p) for p in v.split('.')])
          print(versions[-1])
          ")
          echo "game_version=$VERSION" >> "$GITHUB_OUTPUT"

      # Counts only same-game-version releases, so an update that stays on the same
      # version keeps counting (0.5.3-1, 0.5.3-2, ...) instead of inheriting older versions' totals.
      - name: Work out this release's incremental number
        id: number
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREFIX="TCV_Loader-${{ steps.version.outputs.game_version }}-"
          COUNT=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName \
            --jq "[.[] | select(.tagName | startswith(\"$PREFIX\"))] | length")
          echo "release_number=$((COUNT + 1))" >> "$GITHUB_OUTPUT"

      - name: Compose the shared base name
        id: name
        run: |
          echo "base_name=TCV_Loader-${{ steps.version.outputs.game_version }}-${{ steps.number.outputs.release_number }}" >> "$GITHUB_OUTPUT"

      # Notes are the commit's own description (between the subject and the "tags:" trailer)
      # plus a changelog since the last release tag. A file artifact, not a job output, since
      # --notes would otherwise shell-interpolate arbitrary commit text in a different job.
      - name: Compose the release notes
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          PREV_TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName // ""')

          python3 - <<'EOF' > description.txt
          import os

          body = os.environ.get("MESSAGE", "").splitlines()[1:]
          while body and not body[0].strip():
              body.pop(0)
          for i, line in enumerate(body):
              if line.strip().lower() == "tags:":
                  body = body[:i]
                  break
          while body and not body[-1].strip():
              body.pop()
          print("\n".join(body))
          EOF

          {
            cat description.txt
            if [ -n "$PREV_TAG" ]; then
              echo ""
              echo "---"
              echo ""
              echo "**Commits since $PREV_TAG:**"
              git log --pretty="format:- %s (%h)" "$PREV_TAG"..HEAD
            fi
          } > notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: notes.md

  build:
    needs: prepare
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            venv_python: .venv/bin/python3
            venv_pyinstaller: .venv/bin/pyinstaller
            add_data_sep: ":"
          - os: windows-latest
            platform: windows
            venv_python: .venv/Scripts/python.exe
            venv_pyinstaller: .venv/Scripts/pyinstaller.exe
            add_data_sep: ";"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.2.0

      # Build-tool venv only, torn down with the runner; PyInstaller's own output below is what ships.
      - name: Install build dependencies
        shell: bash
        run: |
          uv venv .venv --managed-python
          uv pip install -r requirements.txt pyinstaller --python "${{ matrix.venv_python }}"

      # --onedir avoids onefile's self-extraction lag. export_presets_template.cfg is the only
      # genuinely-bundled resource (bundled_resource() expects it at the bundle root); ui/ and
      # modpacks/ ship alongside the exe instead, since modpacks/ has to stay real editable files.
      # argparse/struct back combine.py's dynamic load, invisible to PyInstaller's static analysis.
      - name: Build the app with PyInstaller
        shell: bash
        run: |
          "${{ matrix.venv_pyinstaller }}" loader/app.py \
            --name TCV_Loader \
            --onedir --windowed --noconfirm \
            --distpath dist \
            --add-data "loader/loader_core/export_presets_template.cfg${{ matrix.add_data_sep }}." \
            --hidden-import argparse \
            --hidden-import struct

      # Not .cache/ (gdRE/Godot, fetched on first real install, not needed to launch the
      # app), not dev/ (maintainer-only), not .git/install_logs/work/.
      - name: Package the release zip
        id: package
        shell: bash
        run: |
          NAME="${{ needs.prepare.outputs.base_name }}-${{ matrix.platform }}"
          mkdir "$NAME"
          cp -r dist/TCV_Loader/. ui modpacks README.md LICENSE "$NAME/"
          python3 -c "import shutil; shutil.make_archive('$NAME', 'zip', '.', '$NAME')"
          echo "zip_name=$NAME.zip" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.zip_name }}
          path: ${{ steps.package.outputs.zip_name }}

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.prepare.outputs.base_name }}" artifacts/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "${{ needs.prepare.outputs.base_name }}" \
            --notes-file artifacts/notes.md
